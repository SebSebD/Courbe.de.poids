<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Courbe de poids</title>
  <meta name="description" content="Suivi des pesées et des objectifs de poids.">
  <meta name="theme-color" content="#1f5f8b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10181f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Poids">
  <style>
    :root {
      --bg: #f2f5f7;
      --surface: #ffffff;
      --ink: #17242e;
      --muted: #5b6b78;
      --line: #d9e0e6;
      --poids: #1f5f8b;
      --poids-soft: #e1edf6;
      --objectif: #c4473a;
      --sim: #ded33a;
      --ok: #2e9e4f;
      --info: #e6b400;
      --danger: #b3261e;
      --on-accent: #ffffff;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10181f;
        --surface: #18232c;
        --ink: #e6edf2;
        --muted: #93a3b0;
        --line: #2a3742;
        --poids: #6fb1e0;
        --poids-soft: #1d3446;
        --objectif: #ee7b6e;
        --sim: #d9a520;
        --ok: #5fd38a;
        --info: #f2c230;
        --danger: #f2877e;
        --on-accent: #0c1620;
        color-scheme: dark;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%;
    }

    /* iPad / iPhone : pas de zoom au double toucher (le double clic du graphique reste actif) */
    html,
    body,
    button {
      touch-action: manipulation;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100%;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 10;
      background: var(--bg);
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--poids);
      outline-offset: 2px;
    }

    .bar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .bar h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      flex: 1;
      letter-spacing: -0.01em;
    }

    .icon-btn[hidden] {
      display: none;
    }

    .shortcuts {
      display: flex;
      gap: 6px;
    }

    .icon-btn.sm {
      width: 38px;
      height: 38px;
      padding: 0;
    }

    .icon-btn.sm svg {
      width: 24px;
      height: 24px;
    }

    .icon-btn.sm[aria-current] {
      border-color: var(--poids);
      background: var(--poids-soft);
    }

    .bar h1 {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
    }

    h2 {
      font-size: 1.35rem;
      margin: 4px 0 16px;
      letter-spacing: -0.01em;
    }

    h3 {
      font-size: 1rem;
      margin: 28px 0 8px;
    }

    p {
      margin: 0 0 12px;
    }

    .muted {
      color: var(--muted);
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    /* Accueil */
    .hero {
      padding: 8px 0 24px;
    }

    .hero .big {
      font-size: clamp(4rem, 22vw, 6.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--poids);
      font-variant-numeric: tabular-nums;
    }

    .hero .big small {
      font-size: 0.32em;
      letter-spacing: 0;
      margin-left: 6px;
      color: var(--muted);
      font-weight: 600;
    }

    .hero .when {
      color: var(--muted);
      margin-top: 6px;
    }

    .hero .goal {
      margin-top: 14px;
      padding-left: 12px;
      border-left: 3px solid var(--objectif);
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      container-type: inline-size;
    }

    .menu button {
      text-align: left;
      padding: 16px;
      min-height: 92px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .menu button strong {
      font-size: 1.1rem;
    }

    .menu button span {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.3;
    }

    .menu {
      grid-template-rows: 1fr 1fr auto;
    }

    .menu button {
      min-height: 0;
      padding: 12px 14px;
    }

    .menu button span {
      font-size: 0.78rem;
    }

    .menu>button:not(.big-graph) {
      grid-column: 2;
    }

    .menu .big-graph {
      grid-column: 1;
      grid-row: 1 / span 3;
      position: relative;
      width: 100%;
      min-width: 0;
      aspect-ratio: 1;
      height: calc((100cqw - 12px) / 2);
      align-self: start;
    }

    .menu .big-graph strong {
      font-size: 1.15rem;
    }

    .menu .big-graph .gicon {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 62%;
      height: 62%;
      transform: translate(-50%, -50%);
    }

    .menu .big-graph>span {
      font-size: 0.75rem;
    }

    .menu .small-info {
      margin-top: 10px;
      padding: 8px 12px;
      gap: 2px;
    }

    .menu .small-info strong {
      font-size: 0.9rem;
    }

    .menu .small-info span {
      font-size: 0.72rem;
    }

    .menu button {
      position: relative;
    }

    .menu .mi {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
    }

    .menu .small-info .mi {
      top: 8px;
      right: 10px;
      width: 22px;
      height: 22px;
    }

    .menu .big-graph {
      border: 3px solid var(--ink);
    }

    .menu .small-info {
      border: 2px solid var(--info);
    }

    .menu .m-pesee {
      border: 3px solid var(--poids);
    }

    .menu .m-obj {
      border: 3px solid var(--objectif);
    }

    .menu button:active {
      transform: scale(0.985);
    }

    /* Formulaires */
    .entry {
      display: flex;
      gap: 12px;
      align-items: stretch;
      flex-wrap: wrap;
    }

    .kg {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 16px;
      border: 2px solid var(--line);
      background: var(--surface);
      flex: 1 1 160px;
      min-width: 0;
    }

    .kg:focus-within {
      border-color: var(--poids);
    }

    .kg input {
      border: 0;
      background: transparent;
      outline: none;
      width: 100%;
      min-width: 0;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: right;
      font-variant-numeric: tabular-nums;
      padding: 0;
    }

    .kg input::placeholder {
      color: var(--ink);
      -webkit-text-fill-color: var(--ink);
      opacity: 0.1;
    }

    .kg span {
      font-size: 1.2rem;
      color: var(--muted);
      font-weight: 600;
    }

    .datepick {
      position: relative;
      flex: 1 1 200px;
      border-radius: 16px;
      border: 2px solid var(--line);
      background: var(--surface);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .datepick:focus-within {
      border-color: var(--poids);
    }

    .datepick .lbl {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .datepick .val {
      font-weight: 600;
      font-size: 1.05rem;
    }

    /* Le champ de date natif ne sert plus qu'à stocker la valeur : le calendrier est celui de la fenêtre de saisie */
    .datepick input[type=date] {
      pointer-events: none;
    }

    .datepick input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: 0;
      -webkit-appearance: none;
      appearance: none;
    }

    .datepick input.manual {
      position: static;
      opacity: 1;
      height: auto;
      cursor: text;
      background: transparent;
      outline: none;
      padding: 0;
      font-weight: 600;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
      width: 100%;
    }

    .datepick input.manual.bad {
      color: var(--danger);
    }

    .wheel-pop.wide {
      width: min(320px, 92vw);
    }

    .wheel-pop.dual {
      width: min(520px, 94vw);
    }

    .dual-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .dual-row .wheel-box {
      flex: 0 0 170px;
      margin-bottom: 0;
    }

    .cal {
      flex: 1 1 230px;
      min-width: 0;
    }

    .cal button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      text-transform: capitalize;
    }

    .cal-head .cn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.3rem;
      line-height: 1;
    }

    .cal-week,
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .cal-week span {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 2px 0;
    }

    .cal-grid .cd {
      height: 30px;
      border-radius: 50%;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    .cal-grid .cd.out {
      color: var(--muted);
      opacity: 0.55;
    }

    .cal-grid .cd.now {
      box-shadow: inset 0 0 0 1.5px var(--muted);
    }

    .cal-grid .cd.sel {
      background: var(--poids);
      color: var(--on-accent);
      font-weight: 700;
      opacity: 1;
    }

    .wheel-cols {
      display: flex;
      gap: 4px;
    }

    .wheel-cols .wheel {
      flex: 1;
    }

    .wheel-cols .wheel:last-child {
      flex: 1.3;
    }

    .error {
      color: var(--danger);
      min-height: 1.45em;
      margin: 8px 0 0;
      font-size: 0.95rem;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 650;
      border: 1px solid var(--line);
      background: var(--surface);
      text-align: center;
    }

    .btn.primary {
      background: var(--poids);
      border-color: var(--poids);
      color: var(--on-accent);
    }

    .btn.danger {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
    }

    .btn+.btn {
      margin-top: 10px;
    }

    dialog.wipe {
      max-width: 400px;
      padding: 20px;
    }

    dialog.wipe::backdrop {
      background: rgb(0 0 0 / 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    dialog.wipe h3 {
      margin: 0 0 14px;
      text-align: center;
    }

    dialog.wipe p {
      margin: 0;
      font-weight: 400;
    }

    .wipe .or {
      margin: 14px 0 6px !important;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    .wipe .opt {
      padding: 8px 0;
      border-top: 1px solid var(--line);
    }

    .wipe .opt .check {
      font-size: 1rem;
    }

    .wipe .opt .check input {
      accent-color: var(--danger);
    }

    .wipe .opt.all {
      border-top: 0;
      border-bottom: 2px solid var(--line);
    }

    .wipe .hint {
      margin: 2px 0 0 26px !important;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .wipe .hint button {
      all: unset;
      cursor: pointer;
      text-decoration: underline;
    }

    .wipe .btn {
      display: block;
      width: fit-content;
      margin: 12px auto 0;
      padding: 12px 22px;
    }

    .wipe .reset-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: 10px;
    }

    .wipe .reset-row .btn {
      grid-column: 2;
      margin: 0;
    }

    .wipe .undo {
      grid-column: 3;
      justify-self: start;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    .wipe .undo:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .wipe .undo svg {
      width: 22px;
      height: 22px;
    }

    .wipe .btn small {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
    }

    .wipe .btn+.btn {
      margin-top: 10px;
    }

    .stack {
      margin-top: 14px;
    }

    /* Tableaux */
    .rows {
      list-style: none;
      margin: 0 0 16px;
      padding: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }

    .rows li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px 12px 16px;
      border-top: 1px solid var(--line);
    }

    .rows li:first-child {
      border-top: 0;
    }

    .rows .d {
      flex: 1;
      min-width: 0;
    }

    .rows .d small {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .rows .k {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .rows .del {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.3rem;
      border-radius: 10px;
      cursor: pointer;
    }

    .down {
      color: var(--poids);
    }

    .up {
      color: var(--objectif);
    }

    .empty {
      padding: 24px 0;
    }

    /* Graphique */
    .chart-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 4px 4px;
      overflow-x: auto;
    }

    .chart-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      min-width: 320px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }

    .chart-wrap .ax {
      fill: var(--muted);
      font-size: 12px;
      font-family: inherit;
    }

    .chart-wrap .grid {
      stroke: var(--line);
      stroke-width: 1;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.9rem;
      color: var(--muted);
      padding: 8px 12px 4px;
    }

    .legend {
      align-items: center;
    }

    .legend .check:first-child {
      margin-left: auto;
    }

    .legend i {
      display: inline-block;
      width: 18px;
      height: 0;
      border-top: 3px solid;
      vertical-align: middle;
      margin-right: 6px;
    }

    .ctrl {
      margin-top: 18px;
    }

    .ctrl label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 600;
    }

    .ctrl label.scalelab {
      justify-content: flex-start;
      gap: 8px;
    }

    .ctrl label output {
      font-weight: 500;
      color: var(--muted);
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--poids);
      margin: 8px 0 0;
      height: 32px;
    }

    .cursor-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cursor-row input[type=range] {
      flex: 1;
      min-width: 0;
    }

    .cursor-row .arrow {
      flex: none;
      width: 40px;
      height: 40px;
      margin-top: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .credit {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(max(8px, env(safe-area-inset-bottom, 0px)) + 1.3rem);
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: .72rem;
      opacity: .8;
    }

    .maj {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(8px, env(safe-area-inset-bottom, 0px));
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: .72rem;
      opacity: .8;
      pointer-events: none;
    }

    .linkbtn {
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      font-weight: 600;
      color: inherit;
      text-decoration: underline dotted;
      cursor: pointer;
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      margin: 8px 0 6px;
    }

    .modes-group {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .modes .lastbtn {
      justify-self: end;
    }

    @media (max-width: 700px) {
      .modes {
        grid-template-columns: auto auto;
        justify-content: space-between;
      }

      .modes-side {
        display: none;
      }
    }

    .curhead {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 8px;
      font-weight: 600;
    }

    .curhead output {
      justify-self: end;
      font-weight: 500;
      color: var(--muted);
    }

    .curhead .linkbtn,
    .modes button.lastbtn {
      text-decoration: underline;
    }

    .curhead {
      position: relative;
    }

    .curhead .linkbtn {
      position: absolute;
      left: 50%;
      bottom: -7px;
      transform: translateX(-50%);
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .modes button {
      flex: 0 1 auto;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 10px;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .modes button[aria-pressed=true] {
      background: var(--poids);
      border-color: var(--poids);
      color: #fff;
    }

    .modes button.lastbtn {
      border: 2px solid transparent;
      background: none;
      padding: 7px 6px;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .modes button.lastbtn[aria-pressed=true] {
      background: none;
      border-color: var(--ok);
      color: var(--ink);
    }

    .chart-box {
      position: relative;
      margin-top: 12px;
    }

    .checks {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      padding: 4px 8px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--surface) 80%, transparent);
    }

    .checks .check {
      flex-direction: row-reverse;
    }

    .chk-p {
      color: var(--poids);
    }

    .chk-o {
      color: var(--objectif);
    }

    .check:has(#simChk) {
      color: var(--sim);
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--poids);
    }

    .values {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .values div {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .values #cP,
    .values #cO {
      cursor: pointer;
    }

    .values small {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .values b {
      color: var(--poids);
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums;
    }

    .values .sim b {
      color: var(--sim);
    }

    .values .obj b {
      color: var(--objectif);
    }

    .tip-layer {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      overflow: visible;
    }

    .tip-layer rect,
    .tip-layer text {
      pointer-events: all;
      cursor: pointer;
    }

    .tip {
      font-size: 13px;
      font-weight: 600;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .chart-wrap .hit {
      cursor: pointer;
    }

    .simtxt {
      margin-top: 12px;
      padding-left: 12px;
      border-left: 3px solid var(--sim);
    }

    @media (orientation: landscape) and (max-height: 560px) {
      main {
        max-width: 1000px;
      }
    }

    /* Infos */
    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      line-height: 1.5;
    }

    dl.stats {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      margin: 0;
    }

    dl.stats dt {
      color: var(--muted);
    }

    dl.stats dd {
      margin: 0;
      font-weight: 600;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .file-btn {
      position: relative;
      overflow: hidden;
    }

    .file-btn input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* Toast + dialogue */
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      background: var(--ink);
      color: var(--bg);
      padding: 12px 18px;
      border-radius: 12px;
      max-width: calc(100% - 32px);
      transition: opacity .2s, transform .2s;
      z-index: 20;
      font-size: 0.95rem;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    dialog {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      max-width: 340px;
      width: calc(100% - 40px);
      background: var(--surface);
      color: var(--ink);
    }

    dialog::backdrop {
      background: rgb(0 0 0 / 0.45);
    }

    dialog p {
      margin: 0 0 18px;
      font-weight: 600;
    }

    dialog .row {
      display: flex;
      gap: 10px;
    }

    dialog .row .btn {
      margin: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      #toast {
        transition: none;
      }

      .menu button:active {
        transform: none;
      }
    }

    /* Roulette de poids (appui long sur le champ) */
    .wheel-back {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .35);
    }

    .wheel-pop {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 16px 16px;
      width: min(260px, 86vw);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
    }

    .wheel-box {
      position: relative;
      height: 180px;
      margin-bottom: 12px;
    }

    .wheel {
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      overscroll-behavior: contain;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
      -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
    }

    .wheel::-webkit-scrollbar {
      display: none;
    }

    .wheel .pad {
      height: 72px;
    }

    .wheel .it {
      height: 36px;
      line-height: 36px;
      text-align: center;
      font-size: 1.3rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      scroll-snap-align: center;
    }

    .wheel .it.int {
      color: var(--ink);
      font-weight: 700;
      scroll-snap-stop: always;
    }

    .wheel-box::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 72px;
      height: 36px;
      border-top: 2px solid var(--poids);
      border-bottom: 2px solid var(--poids);
      pointer-events: none;
    }
  </style>
</head>

<body>
  <header class="bar">
    <h1 id="title">Courbe de poids</h1>
    <div class="shortcuts" id="shortcuts">
      <button class="icon-btn sm" data-to="graphique" aria-label="Graphique"><svg viewBox="0 0 24 24" fill="none"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 4v16h18" stroke="var(--muted)" stroke-width="1.4" />
          <path d="M5 9l4 3 4-5 6 3" stroke="var(--poids)" />
          <path d="M5 17l5-3 4 2 5-3" stroke="var(--objectif)" stroke-dasharray="3 2.5" />
        </svg></button>
      <button class="icon-btn sm" data-to="pesee" aria-label="Pesée"><svg viewBox="0 0 24 24" fill="none"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke="var(--poids)">
          <rect x="3.5" y="3.5" width="17" height="17" rx="3.5" />
          <path d="M8 10a4 4 0 0 1 8 0z" />
          <path d="M12 10l1.6-2.6" />
        </svg></button>
      <button class="icon-btn sm" data-to="objectif" aria-label="Objectif"><svg viewBox="0 0 24 24" fill="none"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke="var(--objectif)">
          <circle cx="14" cy="4.5" r="2" fill="var(--objectif)" stroke="none" />
          <path d="M13 7.5L11.5 13" />
          <path d="M13 8.5l3.5 1 1-3" />
          <path d="M12.8 8.5L9.5 9l-1 3" />
          <path d="M11.5 13l3 4-2 4" />
          <path d="M11.5 13L8 16l-3.5-1.5" />
          <path d="M2 6h3M1 9h2.5" stroke-width="1.1" opacity=".6" />
        </svg></button>
      <button class="icon-btn sm" data-to="infos" aria-label="Infos / Mémo"><svg viewBox="0 0 24 24" fill="none"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke="var(--muted)">
          <path d="M12 6C10 4.8 6.5 4.5 3 5.2v13c3.5-.7 7-.4 9 .8 2-1.2 5.5-1.5 9-.8v-13C17.5 4.5 14 4.8 12 6z" />
          <path d="M12 6v13" />
        </svg></button>
    </div>
    <button class="icon-btn" id="homeBtn" aria-label="Retour à l’accueil">≡</button>
  </header>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm">
    <p id="confirmMsg"></p>
    <div class="row">
      <button class="btn" value="cancel" id="confirmNo">Annuler</button>
      <button class="btn danger" value="ok" id="confirmYes">Confirmer</button>
    </div>
  </dialog>

  <script>
    "use strict";

    /* ============================================================
       Stockage (remplace pesees.json / objectifs.json)
       ============================================================ */
    const KEYS = { pesees: "cdp.pesees", objectifs: "cdp.objectifs", memo: "cdp.memo", undo: "cdp.undo" };

    function loadList(key) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null || raw.trim() === "") return [];
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) throw new Error("Format invalide");
        return data;
      } catch (e) {
        console.warn("Données corrompues, réinitialisation :", key, e);
        return [];
      }
    }
    function save(key, value) {
      try {
        localStorage.setItem(key, typeof value === "string" ? value : JSON.stringify(value));
        return true;
      } catch (e) {
        toast("Enregistrement impossible : le stockage du navigateur est indisponible.");
        return false;
      }
    }

    let pesees = loadList(KEYS.pesees);
    let objectifs = loadList(KEYS.objectifs);
    const savePesees = () => save(KEYS.pesees, pesees);
    const saveObjectifs = () => save(KEYS.objectifs, objectifs);

    // Demande au navigateur de ne pas effacer les données (utile sur mobile)
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });

    /* ============================================================
       Dates et nombres
       ============================================================ */
    const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
    const MOIS_COURTS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
    const DAY = 86400000;
    const pad = (n) => String(n).padStart(2, "0");
    const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const fromISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
    const formatFr = (d) => `${JOURS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    const shortFr = (d) => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };

    // Accepte "lundi 26/10/2026", "26/10/2026" ou "2026-10-26"
    function parseAnyDate(s) {
      if (!s) return null;
      s = String(s).trim();
      let m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
      m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      return null;
    }
    function parseKg(s) {
      const v = parseFloat(String(s).replace(",", ".").trim());
      return Number.isFinite(v) ? v : null;
    }
    const fmtKg = (v) => v.toLocaleString("fr-FR", { maximumFractionDigits: 1 });
    const fmtDelta = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + fmtKg(Math.abs(v));

    // Liste triée de points {idx, d, kg} à partir des données brutes
    function series(list) {
      return list
        .map((e, idx) => ({ idx, d: parseAnyDate(e.date), kg: parseKg(e.poids) }))
        .filter((p) => p.d && p.kg !== null)
        .sort((a, b) => a.d - b.d);
    }
    function interpolate(pts, t) {
      if (!pts.length) return null;
      if (t < pts[0].d || t > pts[pts.length - 1].d) return null;
      for (let i = 0; i < pts.length; i++) {
        if (+pts[i].d === +t) return pts[i].kg;
        if (pts[i].d > t) {
          const a = pts[i - 1], b = pts[i];
          return a.kg + (b.kg - a.kg) * (t - a.d) / (b.d - a.d);
        }
      }
      return null;
    }
    function nextObjective() {
      const t = today();
      return series(objectifs).find((o) => o.d >= t) || null;
    }

    /* ============================================================
       Utilitaires d'interface
       ============================================================ */
    const app = document.getElementById("app");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let toastTimer;
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function confirmAsk(message, okLabel = "Confirmer") {
      const dlg = document.getElementById("confirm");
      document.getElementById("confirmMsg").textContent = message;
      document.getElementById("confirmYes").textContent = okLabel;
      return new Promise((resolve) => {
        const yes = document.getElementById("confirmYes");
        const no = document.getElementById("confirmNo");
        const done = (v) => { dlg.close(); yes.onclick = no.onclick = dlg.oncancel = null; resolve(v); };
        yes.onclick = () => done(true);
        no.onclick = () => done(false);
        dlg.oncancel = () => done(false);
        if (dlg.showModal) dlg.showModal(); else resolve(window.confirm(message));
      });
    }


    // Roulette : un appui d'une seconde sur le champ de poids l'ouvre ; la saisie manuelle reste possible
    let wheelBusyUntil = 0;
    // Calendrier natif ouvert / saisie en cours : le clic qui les referme ne doit pas ramener au graphique
    const fill = { calOpen: false, ignoreClick: false, graceUntil: 0 };
    function attachWheel(input, getStart, getLast) {
      const H = 36, MIN = 20, MAX = 400, fmt1 = (v) => v.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      let timer = null, x0 = 0, y0 = 0, armed = false, held = false;
      const cancel = () => { clearTimeout(timer); timer = null; };
      input.addEventListener("pointerdown", (e) => {
        x0 = e.clientX; y0 = e.clientY;
        held = false;
        cancel(); timer = setTimeout(() => { timer = null; held = true; open(); }, 1000);
      });
      // 1er clic : saisie manuelle ; 2e clic dans le champ : roulette
      input.addEventListener("click", () => {
        if (held || Date.now() < wheelBusyUntil) return;
        if (armed) { open(); return; }
        armed = true;
        input.select(); input.setSelectionRange(0, input.value.length);
      });
      input.addEventListener("blur", () => { armed = false; });
      input.addEventListener("pointermove", (e) => { if (timer && Math.hypot(e.clientX - x0, e.clientY - y0) > 8) cancel(); });
      ["pointerup", "pointercancel", "pointerleave"].forEach((t) => input.addEventListener(t, cancel));
      input.addEventListener("contextmenu", (e) => { if (timer || Date.now() < wheelBusyUntil) e.preventDefault(); });

      function open() {
        wheelBusyUntil = Date.now() + 600;
        armed = false; input.blur();
        const typed = parseKg(input.value);
        const start = Math.min(MAX, Math.max(MIN, typed !== null ? typed : getStart()));
        const lo = Math.max(MIN, Math.floor(start) - 40), hi = Math.min(MAX, Math.ceil(start) + 40);
        const n = Math.round((hi - lo) * 10) + 1;
        const back = document.createElement("div");
        back.className = "wheel-back";
        let items = "";
        for (let i = 0; i < n; i++) {
          const t = lo * 10 + i;
          items += `<div class="it${t % 10 === 0 ? " int" : ""}" data-i="${i}">${fmt1(t / 10)}</div>`;
        }
        back.innerHTML = `<div class="wheel-pop" role="dialog" aria-label="Choisir le poids">
      <div class="wheel-box"><div class="wheel"><div class="pad"></div>${items}<div class="pad"></div></div></div>
      <button type="button" class="btn primary">OK</button></div>`;
        document.body.appendChild(back);
        const wheel = back.querySelector(".wheel");
        const valueAt = () => lo + Math.min(n - 1, Math.max(0, Math.round(wheel.scrollTop / H))) / 10;
        wheel.scrollTop = Math.round((start - lo) * 10) * H;
        wheel.addEventListener("scroll", () => {
          input.value = fmt1(valueAt());
          input.dispatchEvent(new Event("input"));
        });
        wheel.addEventListener("click", (e) => {
          const it = e.target.closest(".it");
          if (it) wheel.scrollTo({ top: +it.dataset.i * H, behavior: "smooth" });
        });
        // OK valide la valeur de la roulette ; sinon on retrouve la dernière valeur enregistrée
        const close = (ok) => {
          if (ok) input.value = fmt1(valueAt());
          else { const l = getLast && getLast(); input.value = l == null ? "" : fmt1(l); }
          input.dispatchEvent(new Event("input"));
          back.remove(); wheelBusyUntil = Date.now() + 600;
        };
        back.querySelector("button").addEventListener("click", () => close(true));
        back.addEventListener("click", (e) => { if (e.target === back && Date.now() > wheelBusyUntil) close(false); });
      }
    }

    // Date : calendrier natif au 1er clic, saisie manuelle au 2e clic, roulette JJ/MM/AAAA après 1 seconde d'appui
    const MOIS_LONGS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
    const fmtLong = (d) => `${JOURS[d.getDay()]} ${d.getDate() === 1 ? "1er" : d.getDate()} ${MOIS_LONGS[d.getMonth()]} ${d.getFullYear()}`;
    const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();

    function bindDatePicker(root, initial, onChange) {
      const input = root.querySelector("input[type=date]");
      const val = root.querySelector(".val");
      const H = 36;
      let cur = initial, manualAt = 0, armed = false, timer = null, x0 = 0, y0 = 0, wheelShown = false, manualShown = false;

      const setDate = (d) => {
        cur = d; input.value = toISO(d); val.textContent = fmtLong(d);
        onChange && onChange(d);
      };
      input.value = toISO(initial);
      val.textContent = fmtLong(initial);
      input.addEventListener("change", () => {
        if (!input.value) { input.value = toISO(today()); }
        setDate(fromISO(input.value));
      });

      // Saisie manuelle
      const man = document.createElement("input");
      man.className = "manual"; man.hidden = true; man.inputMode = "numeric"; man.autocomplete = "off";
      man.placeholder = "JJ/MM/AAAA"; man.maxLength = 10; man.setAttribute("aria-label", "Date au format jour, mois, année");
      root.appendChild(man);
      function enterManual() {
        manualShown = true; armed = false; manualAt = Date.now();
        input.style.pointerEvents = "none"; input.blur();
        val.hidden = true; man.hidden = false; man.value = ""; man.classList.remove("bad");
        man.focus();
      }
      function leaveManual() {
        if (!manualShown) return;
        manualShown = false;
        man.hidden = true; val.hidden = false; input.style.pointerEvents = "";
      }
      man.addEventListener("input", () => {
        const dg = man.value.replace(/\D/g, "").slice(0, 8);
        man.value = dg.slice(0, 2) + (dg.length > 2 ? "/" + dg.slice(2, 4) : "") + (dg.length > 4 ? "/" + dg.slice(4) : "");
        man.classList.remove("bad");
        if (dg.length < 8) return;
        const d = +dg.slice(0, 2), m = +dg.slice(2, 4), y = +dg.slice(4);
        const dt = new Date(y, m - 1, d);
        if (y >= 1900 && dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d) { setDate(dt); leaveManual(); }
        else man.classList.add("bad");
      });
      man.addEventListener("blur", leaveManual);
      // Un clic dans la zone JJ/MM/AAAA ouvre la roulette (le champ a déjà le focus, on peut taper sans cliquer)
      man.addEventListener("click", () => { if (Date.now() > manualAt + 400) openWheel(); });
      man.addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter") leaveManual(); });
      document.addEventListener("pointerdown", (e) => { if (!root.contains(e.target)) armed = false; });

      // Appui sur la zone : calendrier / saisie manuelle / roulette
      const cancel = () => { clearTimeout(timer); timer = null; };
      root.addEventListener("pointerdown", (e) => {
        if (e.target === man) return;
        x0 = e.clientX; y0 = e.clientY; wheelShown = false;
        cancel(); timer = setTimeout(() => { timer = null; wheelShown = true; openWheel(); }, 1000);
        if (armed) e.preventDefault();
      });
      root.addEventListener("pointermove", (e) => { if (timer && Math.hypot(e.clientX - x0, e.clientY - y0) > 8) cancel(); });
      root.addEventListener("pointercancel", cancel);
      root.addEventListener("pointerleave", cancel);
      root.addEventListener("pointerup", (e) => {
        if (e.target === man) return;
        const quick = !!timer;
        cancel();
        if (quick && armed && !wheelShown) enterManual();
      });
      root.addEventListener("click", (e) => {
        if (e.target === man) return;
        if (wheelShown || manualShown || Date.now() < wheelBusyUntil) { e.preventDefault(); return; }
        openWheel();
      });
      root.addEventListener("contextmenu", (e) => { if (timer || wheelShown) e.preventDefault(); });
      // 3e clic : pendant la saisie manuelle, un clic sur la zone (hors du champ de saisie) ouvre la roulette
      let downManual = false;
      root.addEventListener("pointerdown", (e) => { downManual = manualShown && e.target !== man; }, true);
      root.addEventListener("click", () => { if (downManual) { downManual = false; openWheel(); } });

      function openWheel() {
        wheelBusyUntil = Date.now() + 600;
        wheelShown = true; armed = false; input.blur(); man.blur(); leaveManual();
        // Années 2000 à 2999 : après 2999 on revient à 2000 (et inversement)
        const Y0 = 2000, NY = 1000, DN = 2191, MN = 721;
        const real = (d) => {
          const y = Y0 + (((d.getFullYear() - Y0) % NY) + NY) % NY, m = d.getMonth();
          return new Date(y, m, Math.min(d.getDate(), daysIn(y, m)));
        };
        let v = real(cur), dBase, mBase;
        const dIdx = (d) => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - dBase) / DAY);
        const mIdx = (d) => d.getFullYear() * 12 + d.getMonth() - mBase;
        const col = (items) => `<div class="wheel"><div class="pad"></div>${items}<div class="pad"></div></div>`;
        let yI = "";
        for (let i = 0; i < NY; i++) yI += `<div class="it int">${Y0 + i}</div>`;
        const back = document.createElement("div");
        back.className = "wheel-back";
        back.innerHTML = `<div class="wheel-pop wide dual" role="dialog" aria-label="Choisir la date">
      <div class="dual-row"><div class="wheel-box wheel-cols">${col("")}${col("")}${col(yI)}</div><div class="cal"></div></div>
      <button type="button" class="btn primary">OK</button></div>`;
        document.body.appendChild(back);
        const [wd, wm, wy] = back.querySelectorAll(".wheel");
        const ignore = new Map();
        const rest = new Map();
        const setCol = (el, i) => { const t = i * H; rest.set(el, t); if (el.scrollTop !== t) { ignore.set(el, t); el.scrollTop = t; } };
        const idxOf = (el, n) => Math.min(n - 1, Math.max(0, Math.round(el.scrollTop / H)));
        // Les colonnes jours et mois sont des fenêtres recentrées autour de la date (liste glissante)
        const buildDays = () => {
          dBase = new Date(v.getFullYear(), v.getMonth(), v.getDate() - 1095);
          let h = "";
          for (let i = 0; i < DN; i++) { const d = new Date(dBase.getFullYear(), dBase.getMonth(), dBase.getDate() + i); h += `<div class="it${d.getDate() === 1 ? " int" : ""}">${pad(d.getDate())}</div>`; }
          wd.innerHTML = `<div class="pad"></div>${h}<div class="pad"></div>`;
          setCol(wd, dIdx(v));
        };
        const buildMonths = () => {
          mBase = v.getFullYear() * 12 + v.getMonth() - 360;
          let h = "";
          for (let i = 0; i < MN; i++) h += `<div class="it${(mBase + i) % 12 === 0 ? " int" : ""}">${pad((mBase + i) % 12 + 1)}</div>`;
          wm.innerHTML = `<div class="pad"></div>${h}<div class="pad"></div>`;
          setCol(wm, mIdx(v));
        };
        // Calendrier (à droite), synchronisé avec la roulette
        const cal = back.querySelector(".cal"), sameDay = (a, b) => toISO(a) === toISO(b);
        let cm = new Date(cur.getFullYear(), cur.getMonth(), 1);
        const renderCal = () => {
          const y = cm.getFullYear(), m = cm.getMonth(), off = (new Date(y, m, 1).getDay() + 6) % 7, t = today();
          let cells = "";
          for (let i = 0; i < 42; i++) {
            const d = new Date(y, m, 1 - off + i);
            cells += `<button type="button" class="cd${d.getMonth() !== m ? " out" : ""}${sameDay(d, cur) ? " sel" : ""}${sameDay(d, t) ? " now" : ""}" data-t="${+d}">${d.getDate()}</button>`;
          }
          cal.innerHTML = `<div class="cal-head"><button type="button" class="cn" data-n="-1" aria-label="Mois précédent">‹</button><strong>${MOIS_LONGS[m]} ${y}</strong><button type="button" class="cn" data-n="1" aria-label="Mois suivant">›</button></div>
            <div class="cal-week">${["L", "M", "M", "J", "V", "S", "D"].map((l) => `<span>${l}</span>`).join("")}</div><div class="cal-grid">${cells}</div>`;
        };
        cal.addEventListener("click", (e) => {
          const n = e.target.closest("[data-n]");
          if (n) { cm = new Date(cm.getFullYear(), cm.getMonth() + +n.dataset.n, 1); renderCal(); return; }
          const c = e.target.closest("[data-t]");
          if (c) apply(new Date(+c.dataset.t), null);
        });
        const apply = (nv, from) => {
          v = nv; cur = real(v);
          if (from !== wd) { const i = dIdx(v); if (i < 0 || i >= DN) buildDays(); else setCol(wd, i); }
          if (from !== wm) { const i = mIdx(v); if (i < 0 || i >= MN) buildMonths(); else setCol(wm, i); }
          if (from !== wy) setCol(wy, cur.getFullYear() - Y0);
          input.value = toISO(cur); val.textContent = fmtLong(cur);
          cm = new Date(cur.getFullYear(), cur.getMonth(), 1); renderCal();
          onChange && onChange(cur);
        };
        let idle = null;
        // Un petit défilement (≥ 40 % d'un cran) saute à la valeur suivante / précédente dans le sens du geste
        const ext = new Map(), jumps = new Map(), settle = new Map();
        const watch = (el, fn) => el.addEventListener("scroll", () => {
          const t = ignore.get(el);
          if (t !== undefined && Math.abs(el.scrollTop - t) < 1) { ignore.delete(el); return; }
          ignore.delete(el);
          fn();
          const d = el.scrollTop - (rest.get(el) ?? 0);
          if (Math.abs(d) > Math.abs(ext.get(el) ?? 0)) ext.set(el, d);
          clearTimeout(settle.get(el));
          settle.set(el, setTimeout(() => {
            const r = rest.get(el) ?? 0, e = ext.get(el) ?? 0;
            if (!jumps.get(el) && Math.round(el.scrollTop / H) === Math.round(r / H) && Math.abs(e) >= 0.4 * H) {
              jumps.set(el, true);
              el.scrollTo({ top: r + Math.sign(e) * H, behavior: "smooth" });
            } else { rest.set(el, el.scrollTop); ext.set(el, 0); jumps.set(el, false); }
          }, 130));
          clearTimeout(idle);
          idle = setTimeout(() => {
            if (dIdx(v) < 365 || dIdx(v) > DN - 365) buildDays();
            if (mIdx(v) < 24 || mIdx(v) > MN - 24) buildMonths();
          }, 200);
        });
        watch(wd, () => apply(new Date(dBase.getFullYear(), dBase.getMonth(), dBase.getDate() + idxOf(wd, DN)), wd));
        watch(wm, () => {
          const a = mBase + idxOf(wm, MN), y = Math.floor(a / 12), m = a % 12;
          apply(new Date(y, m, Math.min(v.getDate(), daysIn(y, m))), wm);
        });
        watch(wy, () => {
          const y = Y0 + idxOf(wy, NY), m = v.getMonth();
          apply(new Date(y, m, Math.min(v.getDate(), daysIn(y, m))), wy);
        });
        [wd, wm, wy].forEach((el) => el.addEventListener("click", (e) => {
          const it = e.target.closest(".it");
          if (it) el.scrollTo({ top: [...el.querySelectorAll(".it")].indexOf(it) * H, behavior: "smooth" });
        }));
        buildDays(); buildMonths(); setCol(wy, v.getFullYear() - Y0); renderCal();
        const close = (ok) => {
          clearTimeout(idle); back.remove(); wheelBusyUntil = Date.now() + 600; wheelShown = false;
          armed = true; // un clic de plus sur la zone ouvre la saisie manuelle JJ/MM/AAAA
          if (!ok) setDate(today());
        };
        back.querySelector(".btn.primary").addEventListener("click", () => close(true));
        back.addEventListener("click", (e) => {
          if (e.target !== back || Date.now() <= wheelBusyUntil) return;
          // Un clic sur la zone de date (derrière la fenêtre) la referme en gardant la date et passe directement à la saisie JJ/MM/AAAA
          const r = root.getBoundingClientRect();
          if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) { close(true); enterManual(); }
          else close(false);
        });
      }
      return () => fromISO(input.value);
    }

      try { const c = localStorage.getItem(KEY); if (c) show(c); } catch (_) { }

          show(iso);

    // Tendance linéaire sur les 4 dernières semaines (au moins 2 pesées)
    function trend(P) {
      if (P.length < 2) return null;
      const last = P[P.length - 1].d;
      let pts = P.filter((p) => (last - p.d) / DAY <= 28);
      if (pts.length < 2) pts = P.slice(-3);
      const xs = pts.map((p) => (p.d - last) / DAY), ys = pts.map((p) => p.kg);
      const n = xs.length, mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
      let num = 0, den = 0;
      xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
      if (den === 0) return null;
      const slope = num / den;                   // kg par jour
      const atLast = my + slope * (0 - mx);      // valeur de la tendance à la dernière date
      return { slope, from: last, atLast };
    }

      const allDates = [...P, ...O0].map((p) => p.d);
      const first = new Date(Math.min(...allDates)), lastAll = new Date(Math.max(...allDates));

      app.innerHTML = `

      chartEl.addEventListener("click", (e) => { if (state.dragged) { state.dragged = false; e.stopImmediatePropagation(); } }, true);
      chartEl.addEventListener("pointerdown", (e) => {
        ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (ptrs.size === 1) pan = { x0: e.clientX, c0: state.cursor, auto0: state.auto, moved: false, id: e.pointerId };
        else if (ptrs.size === 2) {
          // Si le premier doigt avait déjà fait glisser le curseur, on annule : le pincement ne doit toucher qu'à l'échelle
          if (pan && pan.moved) { state.cursor = pan.c0; state.auto = pan.auto0; draw(); }
          pan = null;
          // Le graphique est redessiné à chaque pas : on capture les deux doigts pour ne pas perdre leurs événements
          ptrs.forEach((_, id) => { try { chartEl.setPointerCapture(id); } catch (_) { } });
          // Point de départ : la durée réglée par le slider (ou la fenêtre affichée si on vient du zoom sur les pesées)
          const w = state.zoomReal ? windowRange() : null;
          pinch = { d0: pinchDist(), len0: w ? Math.max(1, (w.end - w.start) / DAY) : lenDays() };
        }
      });
      chartEl.addEventListener("pointermove", (e) => {
        if (!ptrs.has(e.pointerId)) return;
        ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pinch && ptrs.size >= 2) {
          state.dragged = true;
          const dist = pinchDist();
          // Mêmes bornes et même courbe que le slider ; t reste décimal pendant le geste pour ne rien perdre aux arrondis
          const [mn, , mx] = scaleDays();
          const want = pinch.len0 * pinch.d0 / dist, len = Math.min(mx, Math.max(mn, want));
          // Au bout de course, on repart de l'écartement actuel : le geste inverse agit aussitôt
          if (len !== want) { pinch.len0 = len; pinch.d0 = dist; }
          const t = Math.round(tFromLen(len));
          if (t !== state.t || state.zoomReal) { state.t = t; state.zoomReal = false; scale.value = t; draw(); }
        } else if (pan && e.pointerId === pan.id) {
          const dx = e.clientX - pan.x0;
          if (!pan.moved && Math.abs(dx) < 6) return;
          if (!pan.moved) { pan.moved = true; state.dragged = true; state.hover = null; try { chartEl.setPointerCapture(e.pointerId); } catch (_) { } }
          const plotW = Math.max(100, chartEl.clientWidth - 54);
          const n = Math.round(pan.c0 + dx / plotW * lenDays());
          const c = magnet(Math.min(+cur.max, Math.max(0, n)));
          if (c !== state.cursor) { setCursor(c); draw(); }
        }
      });
      // Double toucher (iPad : le navigateur n'envoie pas d'événement « dblclick » tactile)
      // Détection indépendante des événements « pointer » : touchstart / touchend
      let lastTap = null, touch = null;
      chartEl.addEventListener("touchstart", (e) => {
        const t = e.touches[0];
        touch = e.touches.length === 1 ? { x: t.clientX, y: t.clientY, t: Date.now(), ok: true } : (touch && { ...touch, ok: false });
      }, { passive: true });
      chartEl.addEventListener("touchmove", (e) => {
        const t = e.touches[0];
        if (touch && (e.touches.length > 1 || Math.hypot(t.clientX - touch.x, t.clientY - touch.y) > 12)) touch.ok = false;
      }, { passive: true });
      chartEl.addEventListener("touchend", (e) => {
        if (!touch || e.touches.length) return;
        const c = e.changedTouches[0], now = Date.now(), tap = touch.ok && now - touch.t < 500;
        touch = null;
        if (!tap) { lastTap = null; return; }
        if (lastTap && now - lastTap.t < 450 && Math.hypot(c.clientX - lastTap.x, c.clientY - lastTap.y) < 40) { lastTap = null; cycleZoom(); }
        else lastTap = { t: now, x: c.clientX, y: c.clientY };
      }, { passive: true });
      const cycleZoom = () => {
        const isGlobal = state.mode === "global" && state.auto && state.t === 500 && !state.zoomReal;
        if (isGlobal && P.length > 1) state.zoomReal = true;
        else setMode("global");
        state.lastCycle = Date.now();
        draw();
      };
      const endPtr = (e) => {
        ptrs.delete(e.pointerId);
        if (ptrs.size < 2) pinch = null;
        if (ptrs.size === 0) { pan = null; setTimeout(() => { state.dragged = false; }, 0); }
      };
      chartEl.addEventListener("pointerup", endPtr);
      chartEl.addEventListener("pointercancel", endPtr);
      chartEl.addEventListener("mouseover", (e) => { const k = keyOf(e); if (k) { state.hover = k; refreshTip(); } });
      chartEl.addEventListener("mouseout", (e) => { if (keyOf(e)) { state.hover = null; refreshTip(); } });
      chartEl.addEventListener("click", (e) => {
        const k = keyOf(e);
        if (k) {
          // Un clic sur un point affiche ses infos (et active « Affichage données »)
          const wasOff = !showVals.checked;
          if (wasOff) enableVals();
          state.pin = !wasOff && state.pin === k ? null : k;
          state.last = false;
          const lb = document.getElementById("lastBtn");
          if (lb) lb.setAttribute("aria-pressed", "false");
          if (wasOff) draw(); else refreshTip();
        }
      });
      showVals.addEventListener("change", () => { state.hover = null; state.pin = null; state.last = false; if (snapChk.checked) magnet(state.cursor); draw(); });
      cur.addEventListener("input", () => { setCursor(magnet(+cur.value)); draw(); });
      snapChk.addEventListener("change", () => { if (snapChk.checked) setCursor(magnet(state.cursor)); draw(); });
      document.getElementById("curToday").addEventListener("click", () => { setCursor(magnet(Math.max(0, dayIdx(today())))); draw(); });
      document.getElementById("prevPt").addEventListener("click", () => goStop(-1));
      document.getElementById("nextPt").addEventListener("click", () => goStop(1));
      // Double clic : Global, puis zoom sur la période des pesées, puis retour à Global
      chartEl.addEventListener("dblclick", () => { if (!(Date.now() - (state.lastCycle || 0) < 600)) cycleZoom(); });
      // Clic sur Poids réel / Objectif : le curseur saute de point en point (en boucle), échelle inchangée, point mis en évidence en vert
      const loopTo = (list, sid) => {
        if (!document.getElementById(sid === "P" ? "pesChk" : "objChk").checked) return;
        const pts = list.map((p, i) => ({ t: +p.d, i })).sort((x, y) => x.t - y.t);
        if (!pts.length) return;
        const c = +dateAt(state.cursor);
        const nxt = pts.find((p) => p.t > c) ?? pts[0];
        setCursor(dayIdx(new Date(nxt.t)));
        enableVals();
        state.hover = null; state.pin = sid + nxt.i;
        draw();
      };
      document.getElementById("cP").addEventListener("click", () => loopTo(P, "P"));
      document.getElementById("cO").addEventListener("click", () => loopTo(O, "O"));
      scale.addEventListener("input", () => { state.t = +scale.value; state.zoomReal = false; draw(); });
      // Dernière pesée : curseur sur le dernier point réel, infos encadrées en vert ; perdu dès que le curseur bouge
      const lastBtn = document.getElementById("lastBtn");
      if (lastBtn) lastBtn.addEventListener("click", () => {
        // Bouton déjà actif : un nouveau clic masque les infos
        if (state.last) { state.last = false; state.pin = null; state.hover = null; draw(); return; }
        if (!document.getElementById("pesChk").checked) return;
        setCursor(dayIdx(P[P.length - 1].d));
        enableVals();
        state.last = true; state.hover = null; state.pin = "P" + (P.length - 1);
        draw();
      });
      document.getElementById("modes").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-mode]");
        if (b) { setMode(b.dataset.mode); draw(); }
      });
      [["pesChk", "P"], ["objChk", "O"]].forEach(([id, sid]) => document.getElementById(id).addEventListener("change", (e) => {
        if (!e.currentTarget.checked && state.pin && state.pin[0] === sid) { state.pin = null; state.last = false; }
        state.hover = null;
        if (snapChk.checked) setCursor(magnet(state.cursor));
        draw();
      }));
      document.getElementById("simChk").addEventListener("change", (e) => {
        state.sim = e.currentTarget.checked;
        draw();
      });
      draw();
      const onResize = () => { if (document.getElementById("chart")) draw(); else window.removeEventListener("resize", onResize); };
      window.addEventListener("resize", onResize);
    }

    /* ============================================================
       INFOS / MÉMO
       ============================================================ */
    function viewInfos() {
      const P = series(pesees);
      let stats = `<p class="muted">Le bilan apparaîtra après votre première pesée.</p>`;
      if (P.length) {
        const a = P[0], z = P[P.length - 1];
        const sem = (z.d - a.d) / DAY / 7;
        const min = P.reduce((m, p) => (p.kg < m.kg ? p : m));
        const next = nextObjective();
        stats = `<dl class="stats">
      <dt>Première pesée</dt><dd>${fmtKg(a.kg)} kg le ${shortFr(a.d)}</dd>
      <dt>Dernière pesée</dt><dd>${fmtKg(z.kg)} kg le ${shortFr(z.d)}</dd>
      <dt>Évolution totale</dt><dd>${fmtDelta(z.kg - a.kg)} kg</dd>
      ${sem >= 1 ? `<dt>Moyenne</dt><dd>${fmtDelta((z.kg - a.kg) / sem)} kg / semaine</dd>` : ""}
      <dt>Poids le plus bas</dt><dd>${fmtKg(min.kg)} kg le ${shortFr(min.d)}</dd>
      <dt>Nombre de pesées</dt><dd>${P.length}</dd>
      ${next ? `<dt>Prochain objectif</dt><dd>${fmtKg(next.kg)} kg le ${shortFr(next.d)}</dd>
               <dt>Reste à perdre</dt><dd>${fmtKg(Math.max(0, z.kg - next.kg))} kg</dd>` : ""}
    </dl>`;
      }
      app.innerHTML = `
    <h2>Notes personnelles</h2>
    <textarea id="memo" placeholder="Notes personnelles…" aria-label="Notes personnelles"></textarea>
    <p class="muted" id="memoState" style="font-size:.85rem">Les notes sont enregistrées automatiquement.</p>
    <h3>Bilan</h3>
    ${stats}
    <h3>Sauvegarde</h3>
    <p class="muted">Les données sont stockées sur cet appareil uniquement. Exportez-les régulièrement pour ne rien perdre.</p>
    <button class="btn" id="export">Exporter les données</button>
    <label class="btn file-btn">Importer un fichier (.json)<input type="file" id="import" accept=".json,application/json"></label>
    <button class="btn danger" id="wipe" style="margin-top:10px">Effacer les données actuelles</button>
    <dialog class="wipe" id="wipePanel" aria-label="Effacer les données actuelles">
      <h3>Effacer les données actuelles</h3>
      <div class="reset-row">
        <button class="btn danger" id="wipeAll">Remise à zéro<small>pesées, objectifs, notes</small></button>
        <button type="button" class="undo" id="wipeUndo" aria-label="Annuler la remise à zéro" title="Annuler la remise à zéro" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      </div>
      <p class="or">ou bien sélectionner :</p>
      <div class="opt all"><label class="check"><input type="checkbox" id="wipeSel"> Tout sélectionner</label></div>
      <div class="opt"><label class="check"><input type="checkbox" data-wipe="pesees"> Effacer toutes les pesées</label>
        <p class="hint">pour effacer les données une à une, rendez-vous dans le <button type="button" data-go="pesees">tableau des pesées</button></p></div>
      <div class="opt"><label class="check"><input type="checkbox" data-wipe="objectifs"> Effacer tous les objectifs</label>
        <p class="hint">pour effacer les données une à une, rendez-vous dans le <button type="button" data-go="objectifs">tableau des objectifs</button></p></div>
      <div class="opt"><label class="check"><input type="checkbox" data-wipe="notes"> Effacer toutes les notes personnelles</label></div>
      <button class="btn danger" id="wipeSelected" disabled>Effacer la sélection</button>
      <button class="btn" id="wipeClose">Fermer</button>
    </dialog>
    <p class="muted" style="font-size:.7rem;text-align:center;margin-top:2rem;opacity:.7"><button type="button" class="linkbtn" id="about" style="text-decoration:underline">À savoir</button></p>
    <dialog class="wipe about" id="aboutDlg" aria-label="À savoir" style="font-size:.7rem;line-height:1.45;color:var(--muted);cursor:pointer">
<div style="white-space:pre-line"><b>Vos données sont stockées localement</b>. Elles restent sur votre appareil, dans votre navigateur.
L’application ne nécessite pas de compte et aucune synchronisation n’est faite.
Vous perdez vos données si vous les videz de votre navigateur, désinstallez l’appli ou changez d’appareil.

Si vous changez d’appareil,
vous pouvez exporter les données dans le menu info/mémo en vue de les importer sur un autre appareil.

L’appli est hébergée sur le site de confiance « https://github.com/ ».
L’appli demande à GitHub la date de la dernière mise à jour : GitHub voit alors l’adresse IP de l’appareil, mais aucune donnée de poids n’est envoyée.

Utilisez un navigateur à jour, avec la date et l’heure de l’appareil exactes,
sinon le navigateur peut afficher « Votre connexion n’est pas privée ».

Une connexion est nécessaire à la première ouverture. Ensuite l’appli fonctionne hors ligne.
L’appli est susceptible d’être mise à jour régulièrement.
Pour qu’une mise à jour soit effective, fermez puis rouvrez l’appli.

Cette appli sert à suivre un poids, pas à donner un avis médical : la simulation proposée est une simple projection à partir des données enregistrées. Pour un régime ou un problème de santé, consultez un professionnel.

Le lien de l’application est https://sebsebd.github.io/Courbe.de.poids/</div>
    </dialog>
    <p class="muted" style="font-size:.7rem;text-align:center;margin-top:.8rem;opacity:.7">Conception : Sébastien Dumont / contact <a href="mailto:pixelsenscene94@gmail.com" style="color:inherit">pixelsenscene94@gmail.com</a></p>`;

      const memo = document.getElementById("memo");
      memo.value = localStorage.getItem(KEYS.memo) || "";
      let t;
      memo.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(() => { if (save(KEYS.memo, memo.value)) document.getElementById("memoState").textContent = "Notes enregistrées."; }, 400);
      });

      // « À savoir » : fenêtre centrée, un clic n'importe où la ferme
      const aboutDlg = document.getElementById("aboutDlg");
      document.getElementById("about").addEventListener("click", () => aboutDlg.showModal());
      aboutDlg.addEventListener("click", () => aboutDlg.close());

      // Effacement des données actuelles : remise à zéro, ou sélection pesées / objectifs / notes
      const wipePanel = document.getElementById("wipePanel"), wipeBtn = document.getElementById("wipe");
      const wipeBoxes = [...wipePanel.querySelectorAll("[data-wipe]")], wipeSel = document.getElementById("wipeSel"), wipeGo = document.getElementById("wipeSelected");
      const syncWipe = () => {
        const n = wipeBoxes.filter((b) => b.checked).length;
        wipeSel.checked = n === wipeBoxes.length; wipeSel.indeterminate = n > 0 && n < wipeBoxes.length;
        wipeGo.disabled = n === 0;
      };
      // Annulation de la dernière remise à zéro : copie des données gardée sur l'appareil
      const undoBtn = document.getElementById("wipeUndo");
      const hasUndo = () => localStorage.getItem(KEYS.undo) !== null;
      undoBtn.disabled = !hasUndo();
      wipeBtn.addEventListener("click", () => { undoBtn.disabled = !hasUndo(); wipePanel.showModal(); });
      undoBtn.addEventListener("click", async () => {
        let snap;
        try { snap = JSON.parse(localStorage.getItem(KEYS.undo)); } catch (_) { }
        if (!snap) { undoBtn.disabled = true; return; }
        if (!(await confirmAsk("Annuler la remise à zéro ? Les données d’avant la remise à zéro seront restaurées et remplaceront les données actuelles.", "Restaurer"))) return;
        pesees = Array.isArray(snap.pesees) ? snap.pesees : []; objectifs = Array.isArray(snap.objectifs) ? snap.objectifs : [];
        savePesees(); saveObjectifs(); save(KEYS.memo, snap.memo || "");
        localStorage.removeItem(KEYS.undo);
        wipePanel.close(); render(); toast("Données restaurées");
      });
      document.getElementById("wipeClose").addEventListener("click", () => wipePanel.close());
      wipePanel.addEventListener("click", (e) => { if (e.target === wipePanel) wipePanel.close(); });
      wipeSel.addEventListener("change", () => { wipeBoxes.forEach((b) => (b.checked = wipeSel.checked)); syncWipe(); });
      wipeBoxes.forEach((b) => b.addEventListener("change", syncWipe));
      const wipe = (what) => {
        if (what.includes("pesees")) { pesees = []; savePesees(); }
        if (what.includes("objectifs")) { objectifs = []; saveObjectifs(); }
        if (what.includes("notes")) save(KEYS.memo, "");
      };
      document.getElementById("wipeAll").addEventListener("click", async () => {
        if (!(await confirmAsk("Remettre l’application à zéro ? Toutes les pesées, tous les objectifs et toutes les notes seront effacés.", "Tout effacer"))) return;
        const oldMemo = localStorage.getItem(KEYS.memo) || "";
        if (pesees.length || objectifs.length || oldMemo.trim()) save(KEYS.undo, { pesees, objectifs, memo: oldMemo });
        wipe(["pesees", "objectifs", "notes"]);
        wipePanel.close(); render(); toast("Toutes les données ont été effacées");
      });
      wipeGo.addEventListener("click", async () => {
        const what = wipeBoxes.filter((b) => b.checked).map((b) => b.dataset.wipe);
        const names = { pesees: "toutes les pesées", objectifs: "tous les objectifs", notes: "toutes les notes personnelles" };
        if (!(await confirmAsk(`Effacer ${what.map((w) => names[w]).join(", ").replace(/, ([^,]*)$/, " et $1")} ?`, "Effacer"))) return;
        wipe(what);
        wipePanel.close(); render(); toast("Données effacées");
      });

      document.getElementById("export").addEventListener("click", () => {
        const data = {
          app: "courbe-de-poids", version: 1, exporte_le: new Date().toISOString(),
          pesees, objectifs, memo: localStorage.getItem(KEYS.memo) || ""
        };
        const blob = new Blob([JSON.stringify(data, null, 4)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `courbe-de-poids-${toISO(today())}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast("Données exportées");
      });

      document.getElementById("import").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        try {
          const data = JSON.parse(await file.text());
          const clean = (arr) => arr.filter((x) => x && parseKg(x.poids) !== null && parseAnyDate(x.date))
            .map((x) => ({ poids: String(parseKg(x.poids)), date: String(x.date) }));
          let addP = [], addO = [], newMemo = null;
          if (Array.isArray(data)) {
            // Anciens fichiers pesees.json / objectifs.json : on reconnaît le format des dates
            const items = clean(data);
            if (items.length && items.every((x) => /^\d{4}-\d{2}-\d{2}/.test(x.date))) addO = items;
            else addP = items;
          } else if (data && typeof data === "object") {
            addP = Array.isArray(data.pesees) ? clean(data.pesees) : [];
            addO = Array.isArray(data.objectifs) ? clean(data.objectifs) : [];
            if (typeof data.memo === "string") newMemo = data.memo;
          }
          if (!addP.length && !addO.length && newMemo === null) throw new Error("vide");

          const msg = [addP.length && `${addP.length} pesée(s)`, addO.length && `${addO.length} objectif(s)`].filter(Boolean).join(" et ");
          if (!(await confirmAsk(`Importer ${msg || "les notes"} ? Les doublons (même date et même poids) seront ignorés.`, "Importer"))) return;

          const key = (x) => `${toISO(parseAnyDate(x.date))}|${parseKg(x.poids)}`;
          const merge = (target, add) => { const seen = new Set(target.map(key)); add.forEach((x) => { if (!seen.has(key(x))) { target.push(x); seen.add(key(x)); } }); };
          merge(pesees, addP); merge(objectifs, addO);
          savePesees(); saveObjectifs();
          if (newMemo !== null && newMemo.trim() && !memo.value.trim()) save(KEYS.memo, newMemo);
          render();
          toast("Import terminé");
        } catch (err) {
          toast("Ce fichier n’est pas reconnu : choisissez un export de l’application, pesees.json ou objectifs.json.");
        }
      });
    }

    /* ============================================================
       Démarrage
       ============================================================ */
    render();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Service worker :", e)));
    }
  </script>
